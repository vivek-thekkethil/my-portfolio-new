<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Model Context Protocol connecting AI to business software">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="80%">
      <stop offset="0" stop-color="#1b1446"/>
      <stop offset=".6" stop-color="#0b0820"/>
      <stop offset="1" stop-color="#04030c"/>
    </radialGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="315" r="150" fill="url(#ai)" opacity=".35" filter="url(#glow)"/>

  <g stroke="url(#ai)" stroke-width="3" stroke-dasharray="10 10" opacity=".7">
    <line x1="600" y1="315" x2="330" y2="150"/>
    <line x1="600" y1="315" x2="870" y2="150"/>
    <line x1="600" y1="315" x2="270" y2="330"/>
    <line x1="600" y1="315" x2="930" y2="330"/>
    <line x1="600" y1="315" x2="350" y2="500"/>
    <line x1="600" y1="315" x2="850" y2="500"/>
  </g>

  <g font-family="Poppins, Segoe UI, Arial, sans-serif" font-weight="600" font-size="24" fill="#fff" text-anchor="middle">
    <g transform="translate(330 150)"><rect x="-75" y="-34" width="150" height="68" rx="34" fill="#140f30" stroke="#ffbd39" stroke-width="2"/><text y="9">CRM</text></g>
    <g transform="translate(870 150)"><rect x="-75" y="-34" width="150" height="68" rx="34" fill="#140f30" stroke="#ffbd39" stroke-width="2"/><text y="9">HR</text></g>
    <g transform="translate(270 330)"><rect x="-75" y="-34" width="150" height="68" rx="34" fill="#140f30" stroke="#ffbd39" stroke-width="2"/><text y="9">Database</text></g>
    <g transform="translate(930 330)"><rect x="-75" y="-34" width="150" height="68" rx="34" fill="#140f30" stroke="#ffbd39" stroke-width="2"/><text y="9">Docs</text></g>
    <g transform="translate(350 500)"><rect x="-75" y="-34" width="150" height="68" rx="34" fill="#140f30" stroke="#ffbd39" stroke-width="2"/><text y="9">Email</text></g>
    <g transform="translate(850 500)"><rect x="-75" y="-34" width="150" height="68" rx="34" fill="#140f30" stroke="#ffbd39" stroke-width="2"/><text y="9">APIs</text></g>
  </g>

  <g transform="translate(600 315)" text-anchor="middle" font-family="Poppins, Segoe UI, Arial, sans-serif">
    <circle r="98" fill="#120c2c" stroke="url(#ai)" stroke-width="5"/>
    <text y="18" font-size="54" font-weight="800" fill="url(#ai)">MCP</text>
  </g>
</svg>
