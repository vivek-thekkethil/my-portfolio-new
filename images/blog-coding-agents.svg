<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="AI coding agent working in a terminal">
  <defs>
    <radialGradient id="bg" cx="30%" cy="30%" r="90%">
      <stop offset="0" stop-color="#2c1a05"/>
      <stop offset=".55" stop-color="#120a22"/>
      <stop offset="1" stop-color="#04030c"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffbd39"/>
      <stop offset="1" stop-color="#ff7043"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="600" cy="330" rx="330" ry="190" fill="url(#gold)" opacity=".22" filter="url(#glow)"/>

  <!-- terminal window -->
  <g transform="translate(270 125)">
    <rect width="660" height="390" rx="24" fill="#0f0b1f" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
    <rect width="660" height="56" rx="24" fill="#1a1430"/>
    <rect y="32" width="660" height="24" fill="#1a1430"/>
    <circle cx="34" cy="28" r="9" fill="#ff5f57"/>
    <circle cx="62" cy="28" r="9" fill="#febc2e"/>
    <circle cx="90" cy="28" r="9" fill="#28c840"/>
    <g font-family="Menlo, Consolas, monospace" font-size="24">
      <text x="36" y="112" fill="#ffbd39">&gt;</text>
      <text x="64" y="112" fill="#fff">add leave approvals with tests</text>
      <text x="36" y="160" fill="#a78bfa">✓ planned 4 steps</text>
      <text x="36" y="200" fill="#22d3ee">✓ edited 6 files</text>
      <text x="36" y="240" fill="#22d3ee">✓ 18 tests passing</text>
      <text x="36" y="280" fill="rgba(255,255,255,.6)">→ waiting for your review</text>
      <rect x="36" y="314" width="16" height="30" fill="#ffbd39"/>
    </g>
  </g>

  <!-- sparkle badge -->
  <g transform="translate(930 125)">
    <circle r="54" fill="#140f30" stroke="url(#ai)" stroke-width="4"/>
    <path fill="url(#ai)" d="M0-30C4-9 9-4 30 0 9 4 4 9 0 30-4 9-9 4-30 0-9-4-4-9 0-30Z"/>
  </g>
</svg>
